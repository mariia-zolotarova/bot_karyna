<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 15px;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background: var(--tg-theme-secondary-bg-color);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Кнопка на всю ширину */
        .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h2 id="welcome">Привіт!</h2>

    <div class="grid">
        <div class="btn" onclick="openMiro()">
            <span class="icon">🎨</span>
            <span class="label">Матеріали Miro</span>
        </div>

        <div class="btn" onclick="openLesson()">
            <span class="icon">🎥</span>
            <span class="label">Урок Zoom</span>
        </div>

        <div class="btn btn-full" onclick="openSchedule()">
            <span class="icon">📅</span>
            <span class="label">Мій розклад</span>
        </div>

        <div class="btn" onclick="showPayment()">
            <span class="icon">💳</span>
            <span class="label">Оплата</span>
        </div>

        <div class="btn" onclick="contactTeacher()">
            <span class="icon">👩‍🏫</span>
            <span class="label">Вчитель</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) document.getElementById('welcome').innerText = `Привіт, ${user.first_name}!`;

        // СЮДИ ВСТАВ ПОСИЛАННЯ, ЯКЕ СКОПІЮВАЛА В КРОЦІ 1 (CSV)
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRS47C4k4QEso7t0axb1RMG7LwOCOiSpBSeaYFLUTwKryeYRWJPEkeEOMp_wGoS0xEWrgyluQ4exIrm/pub?output=csv';

        let userMiroLink = "https://miro.com/app/dashboard/"; // Стандартне посилання

        // Функція завантаження даних із таблиці
        async function loadStudentData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();

                // Розбиваємо CSV на рядки та колонки
                const rows = data.split('\n').slice(1); // Прибираємо шапку
                rows.forEach(row => {
                    const cols = row.split(',');
                    const tableId = cols[0]?.trim();
                    const tableMiro = cols[1]?.trim();

                    // Якщо ID з таблиці збігається з ID користувача в Телеграм
                    if (tableId == user.id) {
                        userMiroLink = tableMiro;
                    }
                });
            } catch (e) {
                console.error("Помилка завантаження таблиці", e);
            }
        }

        // Запускаємо завантаження відразу
        loadStudentData();

        function openMiro() {
            tg.openLink(userMiroLink);
        }

        // Решта функцій залишається такою ж
        function openLesson() { tg.openLink('ПОСИЛАННЯ_НА_ZOOM'); }
        function openSchedule() { tg.openLink('ПОСИЛАННЯ_НА_КАЛЕНДАР'); }
        function contactTeacher() { tg.openTelegramLink('https://t.me/ТВІЙ_НІК'); }

        function showPayment() {
            tg.showPopup({
                title: 'Реквізити',
                message: 'Тут твої реквізити...',
                buttons: [{ type: 'ok' }]
            });
        }
    </script>
</body>

</html>
