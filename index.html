<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 15px;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background: var(--tg-theme-secondary-bg-color);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Кнопка на всю ширину */
        .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h2 id="welcome">Привіт!</h2>

    <div class="grid">
        <div class="btn" onclick="openMiro()">
            <span class="icon">🎨</span>
            <span class="label">Матеріали Miro</span>
        </div>

        <div class="btn" onclick="openLesson()">
            <span class="icon">🎥</span>
            <span class="label">Урок Zoom</span>
        </div>

        <div class="btn btn-full" onclick="openSchedule()">
            <span class="icon">📅</span>
            <span class="label">Мій розклад</span>
        </div>

        <div class="btn" onclick="showPayment()">
            <span class="icon">💳</span>
            <span class="label">Оплата</span>
        </div>

        <div class="btn" onclick="contactTeacher()">
            <span class="icon">👩‍🏫</span>
            <span class="label">Вчитель</span>
        </div>
        <div class="btn" onclick="alert('Мій ID: ' + user.id)">Перевірити мій ID</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) document.getElementById('welcome').innerText = `Привіт, ${user.first_name}!`;

        // СЮДИ ВСТАВ ПОСИЛАННЯ, ЯКЕ СКОПІЮВАЛА В КРОЦІ 1 (CSV)
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRS47C4k4QEso7t0axb1RMG7LwOCOiSpBSeaYFLUTwKryeYRWJPEkeEOMp_wGoS0xEWrgyluQ4exIrm/pub?output=csv';

        let userMiroLink = "https://miro.com/app/dashboard/"; // Стандартне посилання

        // Функція завантаження даних із таблиці
        async function loadStudentData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();

                // Розбиваємо CSV на рядки
                const rows = data.split('\n');
                const currentUserId = String(user.id).trim(); // ID того, хто відкрив бот

                console.log("Шукаємо ID:", currentUserId);

                for (let i = 1; i < rows.length; i++) {
                    // Використовуємо регулярний вираз, щоб правильно розділити коми, 
                    // навіть якщо всередині посилань є символи
                    const cols = rows[i].split(',');
                    if (cols.length < 2) continue;

                    const tableId = cols[0].trim().replace(/"/g, ''); // Прибираємо зайві лапки
                    const tableMiro = cols[1].trim().replace(/"/g, '');

                    if (tableId === currentUserId) {
                        userMiroLink = tableMiro;
                        console.log("Знайдено! Посилання:", userMiroLink);
                        break;
                    }
                }
            } catch (e) {
                console.error("Помилка завантаження таблиці", e);
            }
        }

        // Запускаємо завантаження відразу
        loadStudentData();

        function openMiro() {
            tg.openLink(userMiroLink);
        }

        // Решта функцій залишається такою ж
        function openLesson() { tg.openLink('https://meet.google.com/cxm-odnr-emi'); }
        function openSchedule() { tg.openLink('ПОСИЛАННЯ_НА_КАЛЕНДАР'); }
        function contactTeacher() { tg.openTelegramLink('https://t.me/kov_karyna'); }

        function showPayment() {
            tg.showPopup({
                title: 'Реквізити',
                message: '516875200922',
                buttons: [{ type: 'ok' }]
            });
        }

        function checkMyId() {
            try {
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    alert('Твій ID: ' + tg.initDataUnsafe.user.id);
                } else {
                    alert('Помилка: Telegram не передав дані користувача. Відкрий додаток через бота!');
                }
            } catch (e) {
                alert('Сталася помилка: ' + e.message);
            }
        }
    </script>
</body>

</html>
